name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Provision pinned CMake
        shell: pwsh
        run: |
          $lock = Get-Content cmake/tools-lock.json | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'cmake-4.2.8-windows-x86_64.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'cmake-4.2.8'
          Invoke-WebRequest -Uri $lock.cmake.url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $lock.cmake.sha256) {
            throw "CMake archive SHA-256 mismatch: expected $($lock.cmake.sha256), got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $cmakeBin = Join-Path $extract 'cmake-4.2.8-windows-x86_64/bin'
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$cmakeBin;$env:Path"
          cmake --version

      - name: Print compiler and Windows SDK versions
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsVersion = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          "Visual Studio: $vsVersion ($vsInstall)"
          $vcvars = Join-Path $vsInstall 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "call `"$vcvars`" >nul && cl.exe /? 2>&1"
          if ($LASTEXITCODE -ne 0) { throw "MSVC version probe failed with exit code $LASTEXITCODE" }
          $sdkRoot = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          "Windows SDK root: $sdkRoot"
          Get-ChildItem (Join-Path $sdkRoot 'Include') | Select-Object -ExpandProperty Name

      - name: Configure
        run: cmake --preset windows-vs2022

      - name: Build and test Debug
        shell: pwsh
        run: |
          cmake --build --preset windows-vs2022-debug
          if ($LASTEXITCODE -ne 0) { throw "Debug build failed with exit code $LASTEXITCODE" }
          $vst3 = 'build/windows-vs2022/DisDorktion_artefacts/Debug/VST3/DisDorktion.vst3/Contents/x86_64-win/DisDorktion.vst3'
          $standalone = 'build/windows-vs2022/DisDorktion_artefacts/Debug/Standalone/DisDorktion.exe'
          $audition = 'build/windows-vs2022/DisDorktionAudition_artefacts/Debug/DisDorktion Audition.exe'
          $render = 'build/windows-vs2022/Debug/disdorktion_render.exe'
          foreach ($artifact in @($vst3, $standalone, $audition, $render)) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Missing Debug build artifact: $artifact" }
          }
          $discovery = ctest --preset windows-vs2022-debug --show-only
          if ($LASTEXITCODE -ne 0) { throw "Debug CTest discovery failed with exit code $LASTEXITCODE" }
          $discovery | Tee-Object -FilePath build/windows-vs2022/ctest-discovery-debug.txt
          if (($discovery -join "`n") -notmatch 'Total Tests: [1-9][0-9]*') { throw 'CTest discovered no tests' }
          ctest --preset windows-vs2022-debug --output-on-failure --no-tests=error --output-junit (Join-Path $PWD 'build/windows-vs2022/test-results-debug.xml')
          if ($LASTEXITCODE -ne 0) { throw "Debug CTest run failed with exit code $LASTEXITCODE" }

      - name: Build and test Release
        shell: pwsh
        run: |
          cmake --build --preset windows-vs2022-release
          if ($LASTEXITCODE -ne 0) { throw "Release build failed with exit code $LASTEXITCODE" }
          $vst3 = 'build/windows-vs2022/DisDorktion_artefacts/Release/VST3/DisDorktion.vst3/Contents/x86_64-win/DisDorktion.vst3'
          $standalone = 'build/windows-vs2022/DisDorktion_artefacts/Release/Standalone/DisDorktion.exe'
          $audition = 'build/windows-vs2022/DisDorktionAudition_artefacts/Release/DisDorktion Audition.exe'
          $render = 'build/windows-vs2022/Release/disdorktion_render.exe'
          foreach ($artifact in @($vst3, $standalone, $audition, $render)) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Missing Release build artifact: $artifact" }
          }
          $discovery = ctest --preset windows-vs2022-release --show-only
          if ($LASTEXITCODE -ne 0) { throw "Release CTest discovery failed with exit code $LASTEXITCODE" }
          $discovery | Tee-Object -FilePath build/windows-vs2022/ctest-discovery-release.txt
          if (($discovery -join "`n") -notmatch 'Total Tests: [1-9][0-9]*') { throw 'CTest discovered no tests' }
          ctest --preset windows-vs2022-release --output-on-failure --no-tests=error --output-junit (Join-Path $PWD 'build/windows-vs2022/test-results-release.xml')
          if ($LASTEXITCODE -ne 0) { throw "Release CTest run failed with exit code $LASTEXITCODE" }

      - name: Build and test headless harness
        shell: pwsh
        run: |
          cmake --preset windows-vs2022-dsp-only
          if ($LASTEXITCODE -ne 0) { throw 'Headless configure failed' }
          cmake --build --preset windows-vs2022-dsp-only-release
          if ($LASTEXITCODE -ne 0) { throw 'Headless build failed' }
          ctest --preset windows-vs2022-dsp-only-release --output-on-failure --no-tests=error --output-junit (Join-Path $PWD 'build/windows-vs2022-dsp-only/test-results-release.xml')
          if ($LASTEXITCODE -ne 0) { throw 'Headless tests failed' }
          & 'build/windows-vs2022-dsp-only/Release/disdorktion_render.exe' --help
          if ($LASTEXITCODE -ne 0) { throw 'Headless render CLI help failed' }
          # juceaide is a configure-time JUCE helper that legitimately uses GUI
          # modules. Inspect only the shipped headless project's root targets.
          $headlessProjects = Get-ChildItem build/windows-vs2022-dsp-only -Filter 'disdorktion*.vcxproj'
          if (-not $headlessProjects) { throw 'Headless target project files are missing' }
          $deviceDependencies = $headlessProjects | Select-String -Pattern 'juce_gui_basics.cpp|juce_audio_devices.cpp'
          if ($deviceDependencies) { throw 'Headless build unexpectedly compiles GUI or audio-device modules' }

      - name: Upload test reports and build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-and-test
          path: |
            build/windows-vs2022/test-results-*.xml
            build/windows-vs2022/ctest-discovery-*.txt
            build/windows-vs2022/DisDorktion_artefacts/**
            build/windows-vs2022/DisDorktionAudition_artefacts/**
            build/windows-vs2022/Debug/disdorktion_render.exe
            build/windows-vs2022/Release/disdorktion_render.exe
            build/windows-vs2022-dsp-only/test-results-release.xml
            build/windows-vs2022-dsp-only/Release/disdorktion_render.exe
            build/windows-vs2022/**/DisDorktion_artefacts/**
          if-no-files-found: warn
